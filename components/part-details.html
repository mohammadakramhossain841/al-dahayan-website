<!-- =========================================
     AL-DAHAYAN REUSABLE PART DETAILS
========================================= -->

<article
  class="part-details-component"
  data-component="part-details"
  data-part-id=""
>

  <!-- Header -->

  <div class="part-details-header">

    <div class="part-details-category">

      <span
        class="part-details-category-label"
        data-part-category
      >
        Automotive Part
      </span>

    </div>

    <span
      class="part-details-stock"
      data-part-stock
      hidden
    >
      Stock Status
    </span>

  </div>


  <!-- Main Information -->

  <div class="part-details-main">

    <span class="part-details-eyebrow">
      Spare Part
    </span>

    <h2
      class="part-details-title"
      data-part-name
    >
      Toyota / Lexus Spare Part
    </h2>


    <!-- OEM -->

    <div class="part-details-oem">

      <span class="part-details-label">
        OEM Part Number
      </span>

      <strong
        class="part-details-oem-value"
        data-part-oem
      >
        —
      </strong>

    </div>


    <!-- Information Grid -->

    <div class="part-details-grid">

      <div class="part-details-item">

        <span class="part-details-item-label">
          Brand
        </span>

        <span
          class="part-details-item-value"
          data-part-brand
        >
          —
        </span>

      </div>


      <div class="part-details-item">

        <span class="part-details-item-label">
          Category
        </span>

        <span
          class="part-details-item-value"
          data-part-category-name
        >
          —
        </span>

      </div>


      <div class="part-details-item">

        <span class="part-details-item-label">
          Vehicle Model
        </span>

        <span
          class="part-details-item-value"
          data-part-model
        >
          —
        </span>

      </div>


      <div class="part-details-item">

        <span class="part-details-item-label">
          Part ID
        </span>

        <span
          class="part-details-item-value"
          data-part-id-display
        >
          —
        </span>

      </div>

    </div>

  </div>


  <!-- Compatibility -->

  <section
    class="part-details-compatibility"
    data-part-compatibility
  >

    <h3>
      Vehicle Compatibility
    </h3>

    <div
      class="part-details-compatible-list"
      data-compatible-vehicles
    >
      No compatibility information available.
    </div>

  </section>


  <!-- Availability -->

  <section
    class="part-details-availability"
    data-part-availability
  >

    <h3>
      Availability
    </h3>

    <div class="part-availability-content">

      <span
        class="part-availability-status"
        data-availability-status
      >
        Unknown
      </span>

      <span
        class="part-availability-quantity"
        data-availability-quantity
        hidden
      >
        0
      </span>

    </div>

  </section>


  <!-- Customer Connection -->

  <div class="part-details-actions">

    <a
      href="../pages/inquiry.html"
      class="part-details-button"
      data-part-inquiry
    >
      Send Inquiry
    </a>

    <a
      href="../pages/contact.html"
      class="part-details-button secondary"
      data-part-contact
    >
      Contact Company
    </a>

  </div>

</article>
