<!-- =========================================
     AL-DAHAYAN LANGUAGE SWITCHER
========================================= -->

<div
  class="language-switcher"
  data-component="language-switcher"
  role="group"
  aria-label="Language selection"
>

  <button
    type="button"
    class="language-btn"
    data-language="en"
    aria-label="Switch to English"
    aria-pressed="true"
  >
    EN
  </button>

  <span
    class="language-divider"
    aria-hidden="true"
  >
    /
  </span>

  <button
    type="button"
    class="language-btn"
    data-language="ar"
    aria-label="Switch to Arabic"
    aria-pressed="false"
  >
    AR
  </button>

</div>
