<!-- =========================================
     AL-DAHAYAN REUSABLE PART CARD
========================================= -->

<article
  class="part-card"
  data-component="part-card"
  data-part-id=""
>

  <!-- Part Header -->
  <div class="part-card-header">

    <div class="part-card-category">
      <span data-part-category>
        Automotive Part
      </span>
    </div>

    <span
      class="part-card-stock"
      data-part-stock-status
      hidden
    >
      Stock
    </span>

  </div>


  <!-- Part Information -->
  <div class="part-card-content">

    <h3
      class="part-card-title"
      data-part-name
    >
      Toyota / Lexus Spare Part
    </h3>


    <!-- OEM Number -->
    <div class="part-card-oem">

      <span class="part-card-label">
        OEM Number
      </span>

      <strong
        class="part-card-oem-value"
        data-part-oem
      >
        —
      </strong>

    </div>


    <!-- Details -->
    <div class="part-card-details">

      <div class="part-detail">

        <span class="part-detail-label">
          Brand
        </span>

        <span
          class="part-detail-value"
          data-part-brand
        >
          —
        </span>

      </div>


      <div class="part-detail">

        <span class="part-detail-label">
          Category
        </span>

        <span
          class="part-detail-value"
          data-part-category-name
        >
          —
        </span>

      </div>


      <div class="part-detail">

        <span class="part-detail-label">
          Vehicle
        </span>

        <span
          class="part-detail-value"
          data-part-model
        >
          —
        </span>

      </div>

    </div>


    <!-- Compatibility -->
    <div
      class="part-card-compatibility"
      data-part-compatibility
      hidden
    >

      <span class="part-compatibility-label">
        Compatible Vehicles
      </span>

      <span
        class="part-compatibility-value"
        data-compatible-vehicles
      >
        —
      </span>

    </div>

  </div>


  <!-- Part Actions -->
  <div class="part-card-actions">

    <button
      type="button"
      class="part-card-button"
      data-part-details
    >
      View Details
    </button>

    <a
      href="../pages/inquiry.html"
      class="part-card-button secondary"
      data-part-inquiry
    >
      Send Inquiry
    </a>

  </div>

</article>
