<!-- =========================================
     AL-DAHAYAN REUSABLE PRICE DISPLAY
========================================= -->

<div
  class="price-display-component"
  data-component="price-display"
  data-price-type="inquiry"
>

  <!-- Price Label -->

  <span
    class="price-display-label"
    data-price-label
  >
    Price
  </span>


  <!-- Price Value -->

  <div class="price-display-value-wrapper">

    <strong
      class="price-display-value"
      data-price-value
    >
      Price on Request
    </strong>

    <span
      class="price-display-currency"
      data-price-currency
      hidden
    >
      SAR
    </span>

  </div>


  <!-- Price Status -->

  <span
    class="price-display-status"
    data-price-status
  >
    Contact us for current price and availability.
  </span>


  <!-- Inquiry Action -->

  <a
    href="../pages/inquiry.html"
    class="price-display-button"
    data-price-inquiry
  >
    Request Price
  </a>

</div>
