     AL-DAHAYAN REUSABLE STOCK BADGE
========================================= -->

<span
  class="stock-badge"
  data-component="stock-badge"
  data-stock-status="unknown"
  aria-label="Stock status"
>
  <span
    class="stock-badge-indicator"
    aria-hidden="true"
  ></span>

  <span
    class="stock-badge-label"
    data-stock-label
  >
    Stock Status Unknown
  </span>

  <span
    class="stock-badge-quantity"
    data-stock-quantity
    hidden
  >
    0
  </span>
</span>
