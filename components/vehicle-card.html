<!-- =========================================
     AL-DAHAYAN REUSABLE VEHICLE CARD
========================================= -->

<article
  class="vehicle-card"
  data-component="vehicle-card"
  data-vehicle-id=""
>

  <!-- Vehicle Header -->
  <div class="vehicle-card-header">

    <div class="vehicle-card-brand">
      <span
        class="vehicle-brand"
        data-vehicle-make
      >
        Toyota
      </span>
    </div>

    <span
      class="vehicle-card-status"
      data-vehicle-status
      hidden
    >
      Available
    </span>

  </div>


  <!-- Vehicle Information -->
  <div class="vehicle-card-content">

    <h3
      class="vehicle-card-title"
      data-vehicle-name
    >
      Toyota Vehicle
    </h3>

    <div class="vehicle-card-details">

      <div class="vehicle-detail">

        <span class="vehicle-detail-label">
          Model
        </span>

        <span
          class="vehicle-detail-value"
          data-vehicle-model
        >
          —
        </span>

      </div>


      <div class="vehicle-detail">

        <span class="vehicle-detail-label">
          Year
        </span>

        <span
          class="vehicle-detail-value"
          data-vehicle-year
        >
          —
        </span>

      </div>


      <div class="vehicle-detail">

        <span class="vehicle-detail-label">
          Engine
        </span>

        <span
          class="vehicle-detail-value"
          data-vehicle-engine
        >
          —
        </span>

      </div>

    </div>


    <!-- Compatibility -->
    <div
      class="vehicle-compatibility"
      data-vehicle-compatibility
      hidden
    >

      <span class="vehicle-compatibility-label">
        Parts Compatibility
      </span>

      <span
        class="vehicle-compatibility-value"
        data-compatible-parts-count
      >
        0
      </span>

    </div>

  </div>


  <!-- Vehicle Actions -->
  <div class="vehicle-card-actions">

    <a
      href="#"
      class="vehicle-card-button"
      data-vehicle-details
    >
      View Vehicle
    </a>

    <a
      href="../pages/parts.html"
      class="vehicle-card-button secondary"
      data-vehicle-parts
    >
      Find Parts
    </a>

  </div>

</article>
