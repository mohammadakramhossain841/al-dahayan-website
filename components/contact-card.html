<!-- =========================================
     AL-DAHAYAN REUSABLE CONTACT CARD
========================================= -->

<article
  class="contact-card-component"
  data-component="contact-card"
>

  <!-- =====================================
       Header
  ====================================== -->

  <div class="contact-card-header">

    <span
      class="contact-card-eyebrow"
      data-i18n="nav.contact"
    >
      Contact
    </span>

    <!-- Official Al-Dahayan Logo -->
    <img
      src="../assets/images/1000018142-removebg-preview.png"
      alt="Al-Dahayan Trading Company"
      class="contact-card-logo"
    >

    <h2
      class="contact-card-title"
      data-contact-company-name
    >
      Al-Dahayan Trading Company
    </h2>

    <p
      class="contact-card-subtitle"
      data-contact-company-arabic
      dir="rtl"
    >
      شركة الضحيان التجارية
    </p>

  </div>


  <!-- =====================================
       Contact Methods
  ====================================== -->

  <div class="contact-card-methods">

    <!-- Phone -->

    <a
      href="#"
      class="contact-card-method"
      data-contact-phone
    >

      <span
        class="contact-card-icon"
        aria-hidden="true"
      >
        ☎
      </span>

      <span class="contact-card-method-content">

        <span
          class="contact-card-method-label"
          data-i18n="footer.phone"
        >
          Phone
        </span>

        <span
          class="contact-card-method-value"
          data-contact-phone-text
        >
          Contact company
        </span>

      </span>

    </a>


    <!-- WhatsApp -->

    <a
      href="#"
      class="contact-card-method"
      data-contact-whatsapp
      target="_blank"
      rel="noopener noreferrer"
    >

      <span
        class="contact-card-icon"
        aria-hidden="true"
      >
        WhatsApp
      </span>

      <span class="contact-card-method-content">

        <span
          class="contact-card-method-label"
          data-i18n="footer.whatsapp"
        >
          WhatsApp
        </span>

        <span
          class="contact-card-method-value"
          data-contact-whatsapp-text
        >
          Contact via WhatsApp
        </span>

      </span>

    </a>


    <!-- Email -->

    <a
      href="#"
      class="contact-card-method"
      data-contact-email
    >

      <span
        class="contact-card-icon"
        aria-hidden="true"
      >
        ✉
      </span>

      <span class="contact-card-method-content">

        <span
          class="contact-card-method-label"
          data-i18n="footer.email"
        >
          Email
        </span>

        <span
          class="contact-card-method-value"
          data-contact-email-text
        >
          Send Email
        </span>

      </span>

    </a>


    <!-- Location -->

    <div
      class="contact-card-method"
      data-contact-location
    >

      <span
        class="contact-card-icon"
        aria-hidden="true"
      >
        📍
      </span>

      <span class="contact-card-method-content">

        <span
          class="contact-card-method-label"
          data-i18n="footer.location"
        >
          Location
        </span>

        <span
          class="contact-card-method-value"
          data-contact-address
        >
          Saudi Arabia
        </span>

      </span>

    </div>

  </div>


  <!-- =====================================
       Company Connection
  ====================================== -->

  <div class="contact-card-actions">

    <a
      href="../pages/inquiry.html"
      class="contact-card-button"
      data-i18n="footer.sendInquiry"
    >
      Send Inquiry
    </a>

    <a
      href="../pages/contact.html"
      class="contact-card-button secondary"
      data-i18n="nav.contact"
    >
      Contact Page
    </a>

  </div>

</article>
